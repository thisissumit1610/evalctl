[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evalctl"
version = "0.1.0"
description = "An LLM evaluation harness: YAML task specs, multi-provider runs with rate limiting and caching, exact-match + rubric-judge scoring, and paired bootstrap diffs between runs."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Sumit Kumar" }]
keywords = ["llm", "evaluation", "benchmark", "eval-harness", "bootstrap", "llm-judge"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Deliberately tiny. Everything else -- validation, templating, tables,
# statistics -- is stdlib. See docs/design.md ("Dependency budget").
dependencies = [
  "httpx>=0.24",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/thisissumit1610/evalctl"
Repository = "https://github.com/thisissumit1610/evalctl"
Issues = "https://github.com/thisissumit1610/evalctl/issues"

[project.scripts]
evalctl = "evalctl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/evalctl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Async code is exercised through asyncio.run() inside ordinary sync tests, so
# the suite needs no async plugin and no event-loop configuration.
filterwarnings = ["error::DeprecationWarning:evalctl.*"]
